;  TSYP 14 — The Living Map: Spatial Memory for Emergency Robots
; ============================================================

[platformio]
default_envs = esp32dev

[env]
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_type = debug
build_flags =
    -DCORE_DEBUG_LEVEL=3
build_unflags = -Os

; ---------- ESP32 dev board (prototype) ----------
[env:esp32dev]
platform = espressif32@^6.7.0
board = esp32dev
framework = arduino
lib_deps =
    jgromes/RadioLib@^7.0.0
    bblanchon/ArduinoJson@^7.2.0

; ---------- ESP32-S3 (future target) ----------
[env:esp32s3]
platform = espressif32@^6.7.0
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    jgromes/RadioLib@^7.0.0
    bblanchon/ArduinoJson@^7.2.0